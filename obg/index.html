<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Obrigado!</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #ffffff;
      font-family: 'Poppins', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      color: #1a1a1a;
    }

    .container {
      text-align: center;
      max-width: 420px;
      width: 100%;
    }

    .check-circle {
      width: 80px;
      height: 80px;
      background: #e8f5e9;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 2rem;
    }

    .check-circle svg {
      width: 36px;
      height: 36px;
      stroke: #2e7d32;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    h1 {
      font-size: 1.9rem;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 0.75rem;
      line-height: 1.2;
    }

    p {
      font-size: 0.95rem;
      font-weight: 300;
      color: #666666;
      line-height: 1.7;
      margin-bottom: 2rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: #2e7d32;
      color: #ffffff;
      font-family: 'Poppins', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      text-decoration: none;
      padding: 0.85rem 2rem;
      border-radius: 8px;
      transition: background 0.2s, transform 0.15s;
    }

    .btn:hover {
      background: #256427;
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn svg {
      width: 17px;
      height: 17px;
      stroke: #fff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      flex-shrink: 0;
    }

    .footer-note {
      margin-top: 1.25rem;
      font-size: 0.75rem;
      color: #aaaaaa;
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="check-circle">
      <svg viewBox="0 0 24 24">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>

    <h1>Obrigado pela sua compra!</h1>

    <p>Seu pedido foi confirmado com sucesso.<br>Clique abaixo para acessar seus arquivos.</p>

    <a
      href="https://drive.google.com/drive/folders/1zOZ93QqPncFF_WZsF04RmYL9jiWSzg8R?usp=sharing"
      target="_blank"
      rel="noopener noreferrer"
      class="btn"
    >
      <svg viewBox="0 0 24 24">
        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
      </svg>
      Acessar meus arquivos
    </a>

    <p class="footer-note">O link abre no Google Drive em uma nova aba.</p>

  </div>
</body>
</html>
