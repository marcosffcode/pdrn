<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato — Dark Romance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Outfit', sans-serif;
      font-weight: 300;
      background: #0A0A0A;
      color: #F5F0EB;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .card {
      width: 100%;
      max-width: 440px;
      text-align: center;
    }

    .eyebrow {
      font-size: 10px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #C9A96E;
      margin-bottom: 20px;
      opacity: .7;
    }

    .title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 300;
      font-size: 38px;
      line-height: 1.15;
      margin-bottom: 10px;
    }

    .title em {
      font-style: italic;
      color: #C9A96E;
    }

    .divider {
      width: 40px;
      height: 1px;
      background: #C9A96E;
      opacity: .35;
      margin: 20px auto;
    }

    .subtitle {
      font-size: 14px;
      color: #8a8a8a;
      line-height: 1.65;
      margin-bottom: 36px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 16px 24px;
      border-radius: 8px;
      border: none;
      font-family: 'Outfit', sans-serif;
      font-weight: 500;
      font-size: 14px;
      letter-spacing: .5px;
      cursor: pointer;
      text-decoration: none;
      transition: all .25s;
      margin-bottom: 12px;
    }

    .btn-whatsapp {
      background: #25D366;
      color: #fff;
    }

    .btn-whatsapp:hover {
      background: #20BD5A;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(37,211,102,.2);
    }

    .btn-email {
      background: transparent;
      color: #F5F0EB;
      border: 1px solid #2a2a2a;
    }

    .btn-email:hover {
      border-color: #C9A96E;
      color: #C9A96E;
      transform: translateY(-2px);
    }

    .footer {
      margin-top: 32px;
      font-size: 11px;
      color: #3a3a3a;
    }

    svg { flex-shrink: 0; }
  </style>
</head>
<body>
  <div class="card">

    <div class="eyebrow">Dark Romance Personalizado</div>

    <h1 class="title">Fale <em>conosco</em></h1>

    <div class="divider"></div>

    <p class="subtitle">
      Dúvidas, suporte ou reembolsos?<br>
      Estamos aqui para te ajudar.
    </p>

    <a class="btn btn-whatsapp"
       href="https://wa.me/5563981057366"
       target="_blank" rel="noopener">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
      </svg>
      WhatsApp
    </a>

    <a class="btn btn-email"
       href="mailto:administrativo@alvoecom.com">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="4" width="20" height="16" rx="2"/>
        <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
      </svg>
      administrativo@alvoecom.com
    </a>

    <div class="footer">Garantia de resposta em até 24 horas úteis</div>

  </div>
</body>
</html>
